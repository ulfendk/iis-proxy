services:
  iis-proxy:
    build: .
    image: iis-proxy:latest
    restart: unless-stopped
    ports:
      # Bind to a specific LAN interface IP so the proxy is not reachable
      # from every interface the host has (including any public one). Set
      # LISTEN_BIND_IP (e.g. to your host's LAN IP, or your tailscale0
      # interface's IP) via environment variables — see README. Defaults to
      # every interface if unset, which is NOT recommended.
      - "${LISTEN_BIND_IP:-0.0.0.0}:${LISTEN_PORT:-8080}:8080"
    environment:
      # All of these are substituted from variables set outside this file
      # (a .env file next to it for plain `docker compose`, or the stack's
      # "Environment variables" in Portainer when deployed from a Git
      # repository, where this file can't be edited directly) — see
      # .env.example / README for the full list and defaults.
      UPSTREAM_SCHEME: ${UPSTREAM_SCHEME:-https}
      UPSTREAM_HOST: ${UPSTREAM_HOST:-mail.example.com}
      EXCHANGE_DOMAIN: ${EXCHANGE_DOMAIN:-}
      EXCHANGE_USERNAME: ${EXCHANGE_USERNAME:-}
      EXCHANGE_PASSWORD: ${EXCHANGE_PASSWORD:-}
      UPSTREAM_INSECURE_SKIP_VERIFY: ${UPSTREAM_INSECURE_SKIP_VERIFY:-false}
      # LISTEN_ADDR is left at its built-in default (0.0.0.0:8080, the
      # container's own network namespace) — the ports: binding above is
      # what actually controls exposure, so there's normally no need to
      # override this.

    # Alternative to setting EXCHANGE_PASSWORD directly above: point at a
    # file instead (Docker/Podman secrets convention). Only usable when the
    # referenced file actually exists on the host running the container —
    # not applicable to a Portainer "Repository" stack, since Portainer
    # clones this repo fresh and the file won't be there. For that
    # deployment mode, use Portainer's environment variables UI instead
    # (it has a "sensitive"/masked option for values like this).
    # secrets:
    #   - exchange_password
    # environment:
    #   EXCHANGE_PASSWORD_FILE: /run/secrets/exchange_password

# secrets:
#   exchange_password:
#     file: ./secrets/exchange_password.txt
